name: Build ImpacTrace APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'impac_app/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: impac_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Build release APK
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://impactrace.site/api' }}
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: impactrace-release-apk
          path: impac_app/build/app/outputs/flutter-apk/app-release.apk